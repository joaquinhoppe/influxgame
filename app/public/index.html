<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tira y Afloja</title>
<style>
@property --split{syntax:'<percentage>';inherits:true;initial-value:50%}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#07080f;color:#fff;font-family:'Trebuchet MS',system-ui,sans-serif}
.bg{position:fixed;inset:0;--split:50%;transition:--split .5s cubic-bezier(.2,.9,.3,1.2);
  background:
   radial-gradient(60% 80% at var(--split) 60%,#ffffff14,transparent 70%),
   linear-gradient(90deg,#ff2d55 0%,#8e1236 calc(var(--split) - 6%),#2a1b4d var(--split),#0e3a8f calc(var(--split) + 6%),#1e9bff 100%);
  background-size:100% 100%;animation:hue 14s linear infinite}
@keyframes hue{0%,100%{filter:hue-rotate(-8deg) saturate(1.1)}50%{filter:hue-rotate(8deg) saturate(1.35)}}
.bg::after{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(115deg,#fff0 0 40px,#ffffff08 40px 80px);animation:slide 6s linear infinite}
@keyframes slide{to{background-position:160px 0}}
canvas{position:fixed;inset:0;width:100%;height:100%}
.ui{position:fixed;inset:0;pointer-events:none}
h1{position:absolute;top:18px;left:0;right:0;text-align:center;margin:0;font-size:clamp(28px,4.4vw,64px);letter-spacing:.12em;
  text-shadow:0 0 12px #fff,0 0 30px #ff2d55,0 0 60px #1e9bff;animation:neon 3s ease-in-out infinite}
@keyframes neon{50%{text-shadow:0 0 8px #fff,0 0 40px #1e9bff,0 0 80px #ff2d55;transform:scale(1.02)}}
.team{position:absolute;top:16%;width:34%;text-align:center}
.team.r{left:3%}.team.a{right:3%}
.team h2{margin:0;font-size:clamp(24px,3.4vw,52px);letter-spacing:.2em;text-shadow:0 4px 0 #0006}
.score{font-size:clamp(70px,13vw,210px);font-weight:900;line-height:1;text-shadow:0 8px 0 #0005,0 0 40px #fff6;display:inline-block}
.pop{animation:pop .25s ease-out}@keyframes pop{40%{transform:scale(1.18) rotate(-2deg)}}
.lat{margin-top:6px;display:none;font-size:clamp(14px,1.7vw,26px);background:#000a;border-radius:14px;padding:8px 16px;border:2px solid #fff5}
body.show .lat{display:inline-block;animation:drop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes drop{from{transform:translateY(-30px) scale(.6);opacity:0}}
.lat b{font-size:1.4em;color:#ffe46b}
.badge{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:18px;opacity:.85}
.hint{position:absolute;bottom:8px;right:14px;font-size:13px;opacity:.5}
/* overlays */
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;pointer-events:none}
.ov.on{display:flex}
#lobby .card{background:#fff;border-radius:32px;padding:18px;width:min(30vw,380px);box-shadow:0 0 0 6px #fff4,0 0 80px #fff8;animation:float 3s ease-in-out infinite,glow 2s ease-in-out infinite}
#lobby .card svg{width:100%;height:auto;display:block;border-radius:16px}
#lobby .cap{margin-top:16px;font-size:clamp(22px,2.6vw,40px);font-weight:900;text-shadow:0 3px 0 #0008;animation:blink 1.6s ease-in-out infinite}
#lobby .url{font-size:clamp(14px,1.6vw,24px);opacity:.9;margin-top:4px;background:#0007;padding:4px 14px;border-radius:99px}
@keyframes float{50%{transform:translateY(-14px) rotate(1deg)}}
@keyframes glow{50%{box-shadow:0 0 0 12px #fff2,0 0 140px #fffc}}
@keyframes blink{50%{opacity:.55}}
.chips{position:absolute;top:44%;width:30%;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chips.r{left:3%}.chips.a{right:3%}
.chip{font-size:clamp(26px,3.2vw,48px);animation:chip .5s cubic-bezier(.3,1.8,.5,1) both,bob 2s ease-in-out infinite}
@keyframes chip{from{transform:scale(0) rotate(-180deg)}}
@keyframes bob{50%{transform:translateY(-8px)}}
#count .n{font-size:clamp(160px,34vw,520px);font-weight:900;line-height:1;text-shadow:0 0 40px #fff,0 0 120px #ffd400;animation:zoom 1s ease-out both}
@keyframes zoom{from{transform:scale(3);opacity:0}30%{opacity:1}to{transform:scale(.85)}}
#win{background:#000a;backdrop-filter:blur(4px)}
#win .t{font-size:clamp(54px,10vw,160px);font-weight:900;animation:winin .8s cubic-bezier(.2,1.6,.4,1) both,rainbow 2s linear infinite;text-shadow:0 8px 0 #0008}
#win .s{margin-top:14px;font-size:clamp(18px,2vw,30px);opacity:.9}
@keyframes winin{from{transform:scale(0) rotate(-25deg)}}
@keyframes rainbow{to{filter:hue-rotate(360deg)}}
</style></head><body>
<div class="bg" id="bg"></div>
<canvas id="cv"></canvas>
<div class="ui">
  <h1>🪢 TIRA Y AFLOJA 🪢</h1>
  <div class="team r"><h2>🔴 ROJO</h2><div class="score" id="r">0</div><br><div class="lat" id="rl"></div></div>
  <div class="team a"><h2>AZUL 🔵</h2><div class="score" id="a">0</div><br><div class="lat" id="al"></div></div>
  <div class="chips r" id="cr"></div><div class="chips a" id="ca"></div>
  <div class="badge" id="badge"></div>
  <div class="hint">S iniciar · N lobby · R revelar trampa</div>
  <div class="ov" id="lobby"><div class="card" id="qrbox"></div><div class="cap">📱 ¡ESCANEA Y ÚNETE!</div><div class="url" id="url"></div></div>
  <div class="ov" id="count"><div class="n" id="cn"></div></div>
  <div class="ov" id="win"><div class="t" id="wt"></div><div class="s" id="ws"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const H=()=>{let k=localStorage.k;if(!k){k=(prompt('Clave admin')||'').trim();if(k)localStorage.k=k}return{'Content-Type':'application/json','x-key':k||''}};
const adm=(u,b={})=>fetch(u,{method:'POST',headers:H(),body:JSON.stringify(b)}).then(r=>{if(r.status==401)localStorage.removeItem('k')});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if(k==='r')adm('/admin/reveal',{on:!document.body.classList.contains('show')});
  if(k==='n')adm('/reset');if(k==='s')adm('/admin/start');});

/* ---------- canvas: cuerda, jugadores, chispas, confeti ---------- */
const cv=$('cv'),g=cv.getContext('2d');let W,Hh,DPR=Math.min(devicePixelRatio||1,2);
function size(){W=innerWidth;Hh=innerHeight;cv.width=W*DPR;cv.height=Hh*DPR;g.setTransform(DPR,0,0,DPR,0,0)}size();addEventListener('resize',size);
let S=null,knot=.5,target=.5,t0=0,parts=[],act={r:0,a:0},prev=null,lastPhase='',lastCd=-1;
const ROJO='#ff2d55',AZUL='#1e9bff';
function spawn(team,n){const x=team==='r'?W*.12:W*.88;
  for(let i=0;i<n;i++)parts.push({x:x+(Math.random()-.5)*W*.12,y:Hh*.55+(Math.random()-.5)*80,tx:null,vx:0,vy:0,life:1,c:team==='r'?ROJO:AZUL,team,type:'spark',r:3+Math.random()*4})}
function confetti(color){for(let i=0;i<260;i++){const a=Math.random()*Math.PI*2,v=6+Math.random()*16;
  parts.push({x:W/2,y:Hh*.5,vx:Math.cos(a)*v,vy:Math.sin(a)*v-8,life:1.6,c:Math.random()<.55?color:`hsl(${Math.random()*360} 100% 60%)`,type:'conf',r:5+Math.random()*7,rot:Math.random()*6,vr:(Math.random()-.5)*.4})}}
function frame(t){requestAnimationFrame(frame);g.clearRect(0,0,W,Hh);const dt=Math.min(.05,(t-t0)/1000||.016);t0=t;
  knot+=(target-knot)*Math.min(1,dt*6);
  const y0=Hh*.58,x0=W*.04,x1=W*.96,kx=x0+(x1-x0)*knot,tt=t/1000;
  // cuerda ondulante (más tensa cuanto más actividad)
  const tens=Math.min(1,(act.r+act.a)/12);act.r*=.94;act.a*=.94;
  const wave=x=>y0+Math.sin(x*.02+tt*6)*(8-6*tens)+Math.sin(x*.05-tt*9)*(3-2*tens)+(x<kx?-1:1)*0;
  g.lineCap='round';
  for(const [w,c] of [[22,'#00000055'],[16,'#8b5e2a'],[12,'#d9a95b']]){g.strokeStyle=c;g.lineWidth=w;g.beginPath();
    for(let x=x0;x<=x1;x+=8){const y=wave(x)+(w===22?10:0);x===x0?g.moveTo(x,y):g.lineTo(x,y)}g.stroke()}
  g.strokeStyle='#8b5e2a';g.lineWidth=3;g.setLineDash([6,10]);g.lineDashOffset=-tt*30;g.beginPath();
  for(let x=x0;x<=x1;x+=8){const y=wave(x);x===x0?g.moveTo(x,y):g.lineTo(x,y)}g.stroke();g.setLineDash([]);
  // línea central y nudo
  g.strokeStyle='#fff6';g.setLineDash([10,10]);g.lineWidth=3;g.beginPath();g.moveTo(W/2,Hh*.42);g.lineTo(W/2,Hh*.9);g.stroke();g.setLineDash([]);
  const ky=wave(kx);g.save();g.translate(kx,ky);g.rotate(Math.sin(tt*8)*.06*(1+tens*2));
  g.shadowColor=knot>.5?ROJO:AZUL;g.shadowBlur=40;g.fillStyle='#fff';g.beginPath();g.arc(0,0,24,0,7);g.fill();
  g.shadowBlur=0;g.fillStyle=knot>=.5?ROJO:AZUL;g.beginPath();g.arc(0,0,16,0,7);g.fill();
  g.font='64px serif';g.textAlign='center';g.fillText('🚩',0,-34+Math.sin(tt*10)*3);g.restore();
  // jugadores tirando
  if(S&&S.phase!=='lobby'){
    for(const team of ['r','a']){
      const ro=(team==='r'?S.roster.rojo:S.roster.azul);const list=ro.length?ro.slice(0,10):Array(Math.max(1,Math.min(10,Math.round(S.sim.bots/2)))).fill('🤖');
      const lead=team==='r'?-1:1;const pull=act[team];
      list.forEach((e,i)=>{
        const base=team==='r'?kx-90-i*72:kx+90+i*72;
        const x=base+Math.sin(tt*9+i)*(4+pull*2.5)*lead*-1;
        const y=wave(x)-44+Math.abs(Math.sin(tt*7+i*1.3))*-(6+pull*3);
        g.save();g.translate(x,y);g.rotate(lead*-.28-Math.sin(tt*9+i)*.08*Math.min(3,1+pull/3));
        g.font='46px serif';g.textAlign='center';g.fillText(e,0,0);g.restore();
      });
    }
  }
  // partículas
  parts=parts.filter(p=>{
    if(p.type==='spark'){p.vx+=(kx-p.x)*.012;p.vy+=(wave(kx)-p.y)*.012;p.x+=p.vx;p.y+=p.vy;p.vx*=.92;p.vy*=.92;p.life-=dt*1.1;
      g.globalAlpha=Math.max(0,p.life);g.fillStyle=p.c;g.shadowColor=p.c;g.shadowBlur=14;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill();g.shadowBlur=0;g.globalAlpha=1}
    else{p.vy+=14*dt;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.rot+=p.vr;p.life-=dt*.45;
      g.save();g.globalAlpha=Math.max(0,Math.min(1,p.life));g.translate(p.x,p.y);g.rotate(p.rot);g.fillStyle=p.c;g.fillRect(-p.r,-p.r/2,p.r*2,p.r);g.restore()}
    return p.life>0&&p.y<Hh+40});
  if(parts.length>1800)parts.splice(0,parts.length-1800);
}
requestAnimationFrame(frame);

/* ---------- estado ---------- */
function pop(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}
let lastVer=-1,qrFor='';
new EventSource('/events').onmessage=e=>{
  const s=JSON.parse(e.data);S=s;
  document.body.classList.toggle('show',s.reveal);
  if(prev){const dr=s.rojo-prev.rojo,da=s.azul-prev.azul;
    if(dr>0){pop($('r'));spawn('r',Math.min(dr,12));act.r+=dr}
    if(da>0){pop($('a'));spawn('a',Math.min(da,12));act.a+=da}}
  prev=s;
  $('r').textContent=s.rojo;$('a').textContent=s.azul;
  target=.5+Math.max(-1,Math.min(1,s.diff/s.win))*.45;
  $('bg').style.setProperty('--split',(target*100).toFixed(1)+'%');
  $('rl').innerHTML=`TAG · RAM · <b>${s.lat.rojo}</b> ms`;$('al').innerHTML=`FIELD · DISCO · <b>${s.lat.azul}</b> ms`;
  $('badge').textContent=`🔴 ${s.players.rojo} jugadores · 🔵 ${s.players.azul} jugadores`+(s.players.spectators?` · 👀 ${s.players.spectators} espectadores`:'');
  // lobby
  $('lobby').classList.toggle('on',s.phase==='lobby');
  $('cr').style.display=$('ca').style.display=s.phase==='lobby'?'flex':'none';
  if(s.ver!==lastVer){lastVer=s.ver;const mk=a=>a.map(x=>`<span class="chip">${x}</span>`).join('');$('cr').innerHTML=mk(s.roster.rojo);$('ca').innerHTML=mk(s.roster.azul)}
  const u=s.url||location.origin;if(qrFor!==u){qrFor=u;fetch('/qr.svg').then(r=>r.text()).then(x=>$('qrbox').innerHTML=x);$('url').textContent=u.replace('https://','')+'/play'}
  // cuenta atrás
  $('count').classList.toggle('on',s.phase==='countdown');
  if(s.phase==='countdown'){const n=s.cd>2500?'3':s.cd>1500?'2':s.cd>500?'1':'¡YA!';if(n!==lastCd){lastCd=n;const el=$('cn');el.textContent=n;el.style.animation='none';void el.offsetWidth;el.style.animation=''}}
  else lastCd=-1;
  // ganador
  $('win').classList.toggle('on',s.phase==='finished');
  if(s.phase==='finished'&&lastPhase!=='finished'){const c=s.winner==='rojo'?ROJO:AZUL;confetti(c);setTimeout(()=>confetti(c),700);setTimeout(()=>confetti(c),1400);
    $('wt').textContent=`¡GANA ${s.winner.toUpperCase()}!`;$('wt').style.color=c;
    $('ws').textContent=s.reveal?`ROJO consultó en ${s.lat.rojo} ms (tag) · AZUL en ${s.lat.azul} ms (field)`:'';}
  if(s.phase==='finished')$('ws').textContent=s.reveal?`ROJO consultó en ${s.lat.rojo} ms (tag) · AZUL en ${s.lat.azul} ms (field)`:'';
  lastPhase=s.phase;
};
</script></body></html>
